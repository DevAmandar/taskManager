<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirect</title>
    <script>
      // این اسکریپت کاربر را به صفحه اصلی برنامه هدایت می‌کند
      // تا React Router مسیر را مدیریت کند
      const path = window.location.pathname;
      const base = '/taskManager/';
      if (path !== base) {
        window.location.href = base + '#/' + path.substring(base.length);
      } else {
        window.location.href = base + '#/';
      }
    </script>
  </head>
  <body></body>
</html>
